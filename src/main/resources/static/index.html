<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Users</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .room-list, .user-list { margin-top: 20px; }
        .user-card {
          display: flex; align-items: center; gap: 10px;
          padding: 5px; border-bottom: 1px solid #ccc;
        }
        .user-card img {
          width: 40px; height: 40px; border-radius: 50%;
          object-fit: cover;
        }
    </style>
</head>
<body>
<h1>Room Users</h1>

<div>
    <label for="roomSelect">Select Room:</label>
    <select id="roomSelect"></select>
    <button onclick="joinRoom()">Join Room</button>
</div>

<div class="user-list">
    <h2>Users in Room</h2>
    <div id="usersContainer"></div>
</div>

<script>
    const userId = "68a720b9b41a6cb11a772eb8"; // static userId
    let stompClient = null;
    let currentRoomId = null;

    async function fetchRooms() {
      const res = await fetch("/rooms");
      const json = await res.json();
      const rooms = json.data;
      const select = document.getElementById("roomSelect");

      select.innerHTML = "";
      rooms.forEach(room => {
        const option = document.createElement("option");
        option.value = room.id;
        option.textContent = room.name;
        select.appendChild(option);
      });
    }

    async function joinRoom() {
      const roomId = document.getElementById("roomSelect").value;
      currentRoomId = roomId;

      // Notify backend via WebSocket
      stompClient.send("/app/topic/room.addUser", {}, JSON.stringify({
        roomId: roomId,
        userId: userId
      }));

      // Fetch current users in room
      fetchUsersInRoom(roomId);
    }

    async function fetchUsersInRoom(roomId) {
      const res = await fetch(`/rooms/${roomId}/users`);
      const json = await res.json();
      renderUsers(json.data);
    }

    function renderUsers(users) {
      const container = document.getElementById("usersContainer");
      container.innerHTML = "";
      users.forEach(user => {
        const div = document.createElement("div");
        div.className = "user-card";
        div.innerHTML = `
          <img src="http://localhost:8080/images/${user.avatar || 'https://via.placeholder.com/40'}" alt="avatar"/>
          <span>${user.username}</span>
        `;
        container.appendChild(div);
      });
    }

    function connectWebSocket() {
      const socket = new SockJS("/ws");
      stompClient = Stomp.over(socket);
      stompClient.connect({}, () => {
        stompClient.subscribe("/topic/room", (message) => {
          const msg = JSON.parse(message.body);
          if (msg.roomId === currentRoomId) {
            // Refresh user list if join/leave event in current room
            fetchUsersInRoom(currentRoomId);
          }
        });
      });
    }

    // Initialize
    fetchRooms();
    connectWebSocket();
</script>
</body>
</html>
