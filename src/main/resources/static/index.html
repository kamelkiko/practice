<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket ChatRoom Events</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        .chatroom {
          border: 1px solid #ccc;
          padding: 10px;
          margin: 8px 0;
          border-radius: 6px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .chatroom img {
          width: 60px;
          height: 60px;
          object-fit: cover;
          border-radius: 6px;
        }
        .chatroom-details {
          flex: 1;
        }
        .chatroom-details b {
          font-size: 1.1em;
        }
    </style>
</head>
<body>
<h1>ChatRoom Events</h1>
<div id="rooms"></div>

<script>
    let stompClient = null;
    const roomsDiv = document.getElementById("rooms");

    function connect() {
      const socket = new SockJS("http://localhost:8080/ws");
      stompClient = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({}, function(frame) {
        console.log("Connected: " + frame);

        stompClient.subscribe("/topic/room", function(message) {
          const event = JSON.parse(message.body);
          handleEvent(event);
        });
      });
    }

    function handleEvent(event) {
      const type = event.type;
      const room = event.data;

      if (type === "ADD") {
        addRoom(room);
      } else if (type === "UPDATE") {
        updateRoom(room);
      } else if (type === "DELETE") {
        deleteRoom(room.id);
      }
    }

    function renderRoomHtml(room) {
      const imgTag = room.pictureUrl
        ? `<img src="${room.pictureUrl}" alt="${room.name}"/>`
        : `<img src="https://via.placeholder.com/60?text=No+Img" alt="No image"/>`;

      return `
        ${imgTag}
        <div class="chatroom-details">
          <b>${room.name}</b> (Owner: ${room.owner})<br>
          ${room.description ?? ""}
        </div>
      `;
    }

    function addRoom(room) {
      const div = document.createElement("div");
      div.id = "room-" + room.id;
      div.className = "chatroom";
      div.innerHTML = renderRoomHtml(room);
      roomsDiv.appendChild(div);
    }

    function updateRoom(room) {
      const div = document.getElementById("room-" + room.id);
      if (div) {
        div.innerHTML = renderRoomHtml(room);
      }
    }

    function deleteRoom(id) {
      const div = document.getElementById("room-" + id);
      if (div) {
        div.remove();
      }
    }

    connect();
</script>
</body>
</html>
